
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                padding: 0;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            :root {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            * {
                box-sizing: border-box;
                -webkit-font-smoothing: inherit;
            }

            h1, h2, h3, h4, h5, h6, p, figure {
                margin: 0;
            }

            body, input, textarea, select, button {
                font-size: 12px;
                font-family: sans-serif;
            }
        </style>
    <style>

    <body>
        <style>
.bubble { position:relative; max-width:75%; padding:7px 14px; font-size:13px; line-height:1.35; margin-bottom:8px; }
.bubble-me { align-self:flex-end; background:#0B84FF; color:#FFFFFF; border-radius:18px 18px 4px 18px; }
.bubble-me::before { content:""; position:absolute; z-index:0; bottom:0; right:-6px; height:18px; width:18px; background:#0B84FF; border-bottom-left-radius:13px; }
.bubble-me::after { content:""; position:absolute; z-index:1; bottom:0; right:-9px; width:9px; height:18px; background:#FFFFFF; border-bottom-left-radius:9px; }
.bubble-them { align-self:flex-start; background:#EEEEEE; color:#000000; border-radius:18px 18px 18px 4px; }
.bubble-them::before { content:""; position:absolute; z-index:0; bottom:0; left:-6px; height:18px; width:18px; background:#EEEEEE; border-bottom-right-radius:13px; }
.bubble-them::after { content:""; position:absolute; z-index:1; bottom:0; left:-9px; width:9px; height:18px; background:#FFFFFF; border-bottom-right-radius:9px; }

.chat-row { display:flex; gap:10px; align-items:center; padding:10px 14px; cursor:pointer; border-bottom:1px solid #E2E2E2; }
.chat-row:hover { background:#F2F2F2; }
.chat-row.active { background:#EAF2FF; }
.avatar { width:36px; height:36px; border-radius:50%; background:#E2E2E2; color:#343434; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; flex-shrink:0; }
</style>

<div style="font-family:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;width:700px;height:460px;background:#FFFFFF;border:1px solid #E2E2E2;border-radius:14px;overflow:hidden;display:flex;">

  <!-- Sidebar -->
  <div style="width:260px;border-right:1px solid #E2E2E2;background:#FAFAFA;overflow-y:auto;">

  </div>

  <!-- Conversation pane -->
  <div style="flex:1;display:flex;flex-direction:column;background:#FFFFFF;">
    <div style="padding:14px 16px;border-bottom:1px solid #E2E2E2;text-align:center;">
      <p id="chat-title" style="margin:0;font-size:14px;font-weight:600;color:#343434;"></p>
    </div>
    <div id="messages" style="flex:1;overflow-y:auto;padding:16px 16px 16px 20px;display:flex;flex-direction:column;"></div>
    <div style="padding:10px 12px;border-top:1px solid #E2E2E2;display:flex;gap:8px;align-items:center;">

var activeChatId = chats[0].id;
var chatListEl = document.getElementById('chat-list');
var messagesEl = document.getElementById('messages');
var chatTitleEl = document.getElementById('chat-title');

function renderChatList(){
  chatListEl.innerHTML = '';
  chats.forEach(function(chat){
    var row = document.createElement('div');
    row.className = 'chat-row' + (chat.id === activeChatId ? ' active' : '');
    row.innerHTML =
      (chat.photo
        ? '<img class="avatar" src="' + chat.photo + '" style="object-fit:cover;">'
        : '<div class="avatar">' + chat.initials + '</div>') +
      '<div style="min-width:0;">' +
        '<p style="margin:0;font-size:13px;font-weight:600;color:#343434;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + chat.name + '</p>' +
        '<p style="margin:2px 0 0;font-size:12px;color:#9f9f9f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + chat.preview + '</p>' +
      '</div>';
    row.addEventListener('click', function(){
      activeChatId = chat.id;
      renderChatList();
      renderMessages();
    });
    chatListEl.appendChild(row);
  });
}

function renderMessages(){
  var chat = chats.find(function(c){ return c.id === activeChatId; });
  chatTitleEl.textContent = chat.name;
  messagesEl.innerHTML = '';

  var timestamp = document.createElement('p');
  timestamp.style.cssText = 'text-align:center;font-size:11px;color:#9f9f9f;margin:0 0 10px;';
  timestamp.textContent = chat.initialTimestamp
    ? 'Today ' + chat.initialTimestamp
    : 'Today ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  messagesEl.appendChild(timestamp);

  chat.messages.forEach(function(m){
    if(m.type === 'timestamp'){
      var ts = document.createElement('p');
      ts.style.cssText = 'text-align:center;font-size:11px;color:#9f9f9f;margin:10px 0;';
      ts.textContent = 'Today ' + m.text;
      messagesEl.appendChild(ts);
      return;
    }
    var bubble = document.createElement('div');
    bubble.className = 'bubble ' + (m.sender === 'me' ? 'bubble-me' : 'bubble-them');
    if(m.type === 'image'){
      bubble.className = 'bubble';
      bubble.style.background = 'transparent';
      bubble.style.padding = '0';
      bubble.innerHTML = '<img src="' + m.image + '" style="width:180px;height:144px;object-fit:cover;border-radius:12px;display:block;">';
    } else if(m.type === 'imagestack'){
      bubble.style.background = 'transparent';
      bubble.style.padding = '0';
      bubble.className = 'bubble';
      bubble.style.display = 'flex';
      bubble.style.alignItems = 'flex-end';
      bubble.style.margin = '10px 0 16px 0';
      bubble.innerHTML =
        '<img src="' + m.images[1] + '" style="position:relative;z-index:1;width:110px;height:130px;object-fit:cover;border-radius:10px;transform:rotate(4deg);">' +
        '<img src="' + m.images[0] + '" style="position:relative;z-index:2;width:110px;height:130px;object-fit:cover;border-radius:10px;transform:rotate(-6deg);margin-left:-85px;">';
    } else if(m.type === 'link'){
      bubble.style.cursor = 'pointer';
      bubble.style.display = 'flex';
      bubble.style.alignItems = 'center';
      bubble.style.gap = '10px';
      var iconHtml;
      if(m.icon){
        iconHtml =
          '<span style="width:32px;height:32px;background:' + (m.iconBg || '#FFFFFF') + ';border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
            '<img src="' + m.icon + '" style="width:22px;height:22px;object-fit:contain;display:block;">' +
          '</span>';
      } else {
        iconHtml =
          '<span style="width:32px;height:32px;background:#0A66C2;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none">' +
              '<circle cx="7.5" cy="7" r="1.8" fill="#FFFFFF"/>' +
              '<rect x="6.2" y="10" width="2.6" height="8" rx="0.4" fill="#FFFFFF"/>' +
              '<rect x="10.5" y="10" width="2.6" height="8" rx="0.4" fill="#FFFFFF"/>' +
              '<path d="M11.6 12.6 Q11.6 10 14.2 10 Q16.9 10 16.9 12.9 L16.9 18 L14.3 18 L14.3 13.2 Q14.3 12.2 13.25 12.2 Q12.2 12.2 12.2 13.2" fill="#FFFFFF"/>' +
            '</svg>' +
          '</span>';
      }
      bubble.innerHTML = '<span>' + m.label + '</span>' + iconHtml;
      bubble.addEventListener('click', function(){
        window.open(m.url, '_blank');
      });
    } else {
      bubble.textContent = m.text;
    }
    messagesEl.appendChild(bubble);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

document.getElementById('send-btn').addEventListener('click', function(){
  var input = document.getElementById('message-input');
  var text = input.value.trim();
  if(!text) return;
  var chat = chats.find(function(c){ return c.id === activeChatId; });
  chat.messages.push({ text: text, sender: 'me' });
  chat.preview = text;
  input.value = '';
  renderMessages();
  renderChatList();
});
document.getElementById('message-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter') document.getElementById('send-btn').click();
});

renderChatList();
renderMessages();
</script>
        <script type="module">
            let height = 0

            function sendEmbedHeight() {
                window.parent.postMessage({
                    embedHeight: height
                }, "*")
            }

            const observer = new ResizeObserver((entries) => {
                if (entries.length !== 1) return
                const entry = entries[0]
                if (entry.target !== document.body) return

                height = entry.contentRect.height
                sendEmbedHeight()
            })

            observer.observe(document.body)

            window.addEventListener("message", (event) => {
                if (event.source !== window.parent) return
                if (event.data !== "getEmbedHeight") return
                sendEmbedHeight()
            })
        </script>
