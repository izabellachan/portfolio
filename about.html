<style>
/* About page: a horizontal storyline (Figma: portfolio › about — storyline). Same sidebar and panel as Work/Play.
   Everything in the photo clusters is in Figma pixels × --u, so the layout scales with the panel's height
   (Figma's panel is 792px tall). Photos have no outline, just Figma's small rounded corners. */
body.about{background:var(--canvas)}
.story-panel{flex:1 1 0;min-width:0;position:sticky;top:20px;height:calc(100vh - 40px);min-height:520px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);container-type:size}
/* the wish field sits under the story, so the panel scrolls with the page instead of sticking */
.main-col > .story-panel{flex:none;position:relative;top:auto;width:100%}
.story-panel::before,.story-panel::after{content:"";position:absolute;top:0;bottom:0;width:56px;z-index:4;pointer-events:none}
.story-panel::before{left:0;background:linear-gradient(90deg,var(--surface),rgba(255,255,255,0))}
.story-panel::after{right:0;background:linear-gradient(270deg,var(--surface),rgba(255,255,255,0))}
.track{--u:calc(100cqh / 792);position:absolute;inset:0;display:flex;align-items:center;gap:calc(214 * var(--u));padding:0 calc(96 * var(--u)) calc(95 * var(--u));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;outline:none}
.track::-webkit-scrollbar{display:none}
.track.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.track:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-text);border-radius:var(--radius-md)}
.chapter{position:relative;flex:none;display:flex;align-items:center;gap:calc(55.44 * var(--u))}
.cluster{position:relative;flex:none}
.ph{position:absolute;margin:0;overflow:hidden;background:#d9d9d9;transform:rotate(var(--r,0deg));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.ph:hover{transform:rotate(var(--rh,0deg)) scale(1.03);z-index:3}
.ph img,.ph video{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.ph .cover{inset:0;width:100%;height:100%;object-fit:cover}
.ph.mirror img{transform:scaleX(-1)}
/* handwritten captions spread around each photo cluster, each with a short drawn arrow to its photo.
   They "write" themselves in (left-to-right reveal), then the arrow draws, when the chapter scrolls into view. */
.note{position:absolute;z-index:3;left:0;top:0;white-space:nowrap;transform:translateY(-100%) rotate(-2deg);transform-origin:0 100%;font-family:"Schoolbell",cursive;font-size:12px;line-height:1.05;color:var(--text-strong);pointer-events:none}
.note.wrap,.note.wrap .ink{white-space:normal}
.note .ink{display:block;white-space:pre;clip-path:inset(-30% 100% -30% 0)}
.chapter.seen .note .ink{animation:write var(--w,.9s) linear var(--d,0s) forwards}
@keyframes write{to{clip-path:inset(-30% 0 -30% 0)}}
.arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
.arrows path{vector-effect:non-scaling-stroke}
.arrows path{fill:none;stroke:var(--text-strong);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.chapter.seen .arrows path{animation:icon-draw .4s cubic-bezier(.45,0,.25,1) forwards}
.copy{flex:none;width:316.8px;display:flex;flex-direction:column;gap:10px}
.copy .when{margin:0;font-family:"Instrument Sans",sans-serif;font-weight:400;font-size:11px;line-height:normal;letter-spacing:-0.03em;color:var(--text-label);white-space:nowrap}
.copy .story{margin:0;font-family:"Instrument Sans",sans-serif;font-weight:400;font-size:16px;line-height:1.25;letter-spacing:-0.03em;color:var(--text)}
.copy .story + .story{margin-top:20px}
.copy .story.big{font-size:18px;color:var(--text-strong)}
/* the ending */
.copy .story.end{font-family:var(--helvetica);font-size:26px;line-height:1.25;color:var(--text)}
.copy .story.end b{font-weight:400;color:var(--text-strong)}
.copy .story.end a{color:var(--text-strong);text-decoration:none;padding-bottom:3px;background:linear-gradient(var(--line),var(--line)) no-repeat 0 100% / 0% 2px;transition:background-image .2s ease}
.copy .story.end a:hover{background-image:linear-gradient(var(--text-strong),var(--text-strong))}
.chapter.seen .story.end a{animation:underline-write .55s cubic-bezier(.45,0,.25,1) .3s forwards}
.chapter.seen .story.end a + a{animation-delay:.95s}
@keyframes underline-write{to{background-size:100% 2px}}
/* filmstrip */
.film{position:absolute;left:50%;bottom:3.2cqh;z-index:5;transform:translateX(-50%);display:flex;align-items:flex-end;gap:5px;padding-top:44px}
.film button{flex:none;height:max(22px,4cqh);padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--surface-sunken);opacity:.5;cursor:pointer;transition:height .3s cubic-bezier(.22,1,.36,1),opacity .3s ease}
.film button img{display:block;width:100%;height:100%;object-fit:cover}
.film button:hover{opacity:.85}
.film button.on{height:max(32px,6cqh);opacity:1}
.film button:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.film-label{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none;transition:left .3s cubic-bezier(.22,1,.36,1)}
.film-label b{display:block;font-family:var(--helvetica);font-weight:400;font-size:12px;letter-spacing:-0.03em;color:var(--text-strong)}
.film-label span{display:block;font-family:"Instrument Sans",sans-serif;font-size:11px;letter-spacing:-0.03em;color:var(--text-label)}
.hint{position:absolute;left:24px;bottom:3.6cqh;z-index:5;font-family:"Instrument Sans",sans-serif;font-size:11px;letter-spacing:-0.03em;color:var(--text-label);transition:opacity .4s ease}
.hint.off{opacity:0}
@media (max-width: 640px){
  .story-panel{position:relative;top:auto;flex:none;align-self:stretch;height:78vh;min-height:480px}
  .hint{display:none}
  .film{gap:3px}
  .film button{height:16px;border-radius:3px}
  .film button.on{height:26px}
  .copy{width:260px}
}
@media (prefers-reduced-motion: reduce){.copy .story.end a{background-size:100% 2px}.chapter.seen .story.end a{animation:none}.ph,.film button,.film-label{transition:none}.chapter.seen .arrows path{animation:none;stroke-dashoffset:0}.note .ink,.chapter.seen .note .ink{animation:none;clip-path:none}}
</style>

      { id: 'camp-selfie', src: A + 'camp-selfie.jpg', alt: 'A selfie with my campers', box: [257.94, 208.04, 202.533, 134.971], size: [202.533, 134.971], r: 0, mirror: true },
    ],
    notes: [
      { text: 'playing volleyball', x: -30, y: 122, arrows: [{ from: [-39, 133], via: [-42, 172], to: [-10, 172] }] },
      { text: 'summer camp counseling', x: 165, y: 40, arrows: [{ from: [321, 34], via: [340, 38], to: [336, 73] }] },
      { text: 'eating good food', x: 482, y: -37, arrows: [{ from: [472, -42], via: [424, -42], to: [420, -10] }] },
      { text: 'cheeese', x: 349, y: 370, arrows: [{ from: [339, 366], via: [312, 368], to: [312, 352] }] },
    ] },
];

(() => {
  const panel = document.querySelector('.story-panel');
  const track = panel.querySelector('.track');
  const film = panel.querySelector('.film');
  const filmLabel = film.querySelector('.film-label');
  const hint = panel.querySelector('.hint');
  const NS = 'http://www.w3.org/2000/svg';
  const u = v => `calc(${v} * var(--u))`;
  const stops = [];

  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  STORY.forEach((ch, ci) => {
    const chapter = el('section', 'chapter');
    chapter.setAttribute('aria-label', ch.name);
    if (ch.gap != null) chapter.style.gap = u(ch.gap);
    const cluster = el('div', 'cluster');
    Object.assign(cluster.style, { width: u(ch.cluster[0]), height: u(ch.cluster[1]) });
    const byId = {};
    ch.photos.forEach(p => {
      const fig = el('figure', 'ph' + (p.mirror ? ' mirror' : ''));
      const [L, T, BW, BH] = p.box, [w, h] = p.size;
      Object.assign(fig.style, { left: u(L + (BW - w) / 2), top: u(T + (BH - h) / 2), width: u(w), height: u(h), borderRadius: u(ch.radius) });
      fig.style.setProperty('--r', `${p.r || 0}deg`);
      fig.style.setProperty('--rh', `${Math.round((p.r || 0) / 90) * 90}deg`); // hover straightens to the nearest upright angle
      let media = null;
      if (p.video) {
        media = el('video');
        Object.assign(media, { src: p.video, muted: true, loop: true, autoplay: true, playsInline: true });
        media.setAttribute('muted', ''); media.setAttribute('playsinline', ''); media.setAttribute('aria-label', p.alt || '');
        if (p.poster) media.poster = p.poster;
      } else if (p.src) {
        media = new Image(); media.src = p.src; media.alt = p.alt || ''; media.draggable = false; media.loading = 'lazy';
      } else {
        fig.setAttribute('role', 'img'); fig.setAttribute('aria-label', p.alt || '');
      }
      if (media) {
        if (p.crop) Object.assign(media.style, { left: `${p.crop[0]}%`, top: `${p.crop[1]}%`, width: `${p.crop[2]}%`, height: `${p.crop[3]}%`, objectFit: 'cover' });
        else media.classList.add('cover');
        fig.append(media);
      }
      cluster.append(fig);
      byId[p.id] = fig;
    });
    chapter.append(cluster);

    // captions + their arrows, placed from the Figma sketch (same px as the photos, scaled with the panel)
    const notes = [];
    if (ch.notes.length) {
      const [W, H] = ch.cluster;
      const svg = svgEl('svg', { class: 'arrows', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
      let t = 0.15;
      ch.notes.forEach(n => {
        const note = el('div', 'note' + (n.w ? ' wrap' : ''));
        note.append(el('span', 'ink', n.text));
        Object.assign(note.style, { left: u(n.x), top: u(n.y + 6) });
        if (n.w) note.style.width = u(n.w);
        const dur = Math.min(0.8, Math.max(0.3, n.text.length * 0.025));
        note.style.setProperty('--d', `${t.toFixed(2)}s`);
        note.style.setProperty('--w', `${dur.toFixed(2)}s`);
        cluster.append(note);
        (n.arrows || []).forEach(a => {
          const [fx, fy] = a.from, [vx, vy] = a.via, [tx, ty] = a.to;
          const curve = svgEl('path', { d: `M${fx} ${fy}Q${vx} ${vy} ${tx} ${ty}`, pathLength: 1 });
          curve.style.animationDelay = `${(t + dur).toFixed(2)}s`;
          let dx = tx - vx, dy = ty - vy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
          const hx = tx - dx * 8, hy = ty - dy * 8, nx = -dy * 4.5, ny = dx * 4.5;
          const head = svgEl('path', { d: `M${(hx + nx).toFixed(1)} ${(hy + ny).toFixed(1)}L${tx} ${ty}L${(hx - nx).toFixed(1)} ${(hy - ny).toFixed(1)}`, pathLength: 1 });
          head.style.animationDelay = `${(t + dur + 0.35).toFixed(2)}s`; head.style.animationDuration = '.2s';
          svg.append(curve, head);
        });
        notes.push(note);
        t += dur * 0.55 + 0.08;
      });
      cluster.append(svg);
    }

    const copy = el('div', 'copy');
    copy.append(el('p', 'when', ch.label));
    ch.text.forEach(tx => copy.append(el('p', 'story', tx)));
    if (ch.big) copy.append(el('p', 'story big', ch.big));
    chapter.append(copy);
    track.append(chapter);
    stops.push({ el: chapter, chapter: ch, n: ci + 1, thumb: ch.photos.find(p => p.src || p.poster) });
  });

  /* the ending */
  const end = el('section', 'chapter');
  end.setAttribute('aria-label', 'The end, for now');
  end.innerHTML = '<div class="copy"><p class="when">THE END, FOR NOW</p><p class="story end"><b>that’s me (so far)!</b> <a href="./">see my work</a> or <a href="/play">come play</a>.</p></div>';
  track.append(end);

  /* filmstrip: one stop per chapter (its first photo); click to jump there */
  stops.forEach((s, i) => {
    const b = el('button');
    b.type = 'button';
    b.setAttribute('aria-label', `${String(s.n).padStart(2, '0')}, ${s.chapter.name}`);
    const t = s.thumb;
    b.style.aspectRatio = String(Math.min(Math.max(t.size[0] / t.size[1], 0.6), 1.6));
    const img = new Image(); img.src = t.src || t.poster; img.alt = ''; img.loading = 'lazy'; b.append(img);
    b.addEventListener('click', () => scrollToStop(i));
    film.append(b);
    s.btn = b;
  });

  const centreOf = e => { const r = e.getBoundingClientRect(); return r.left + r.width / 2; };
  const scrollToStop = i => {
    const tr = track.getBoundingClientRect();
    track.scrollBy({ left: centreOf(stops[i].el) - (tr.left + tr.width / 2), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  };

  let active = -1;
  const update = () => {
    const tr = track.getBoundingClientRect(), mid = tr.left + tr.width / 2;
    let best = 0, bestD = Infinity;
    stops.forEach((s, i) => { const d = Math.abs(centreOf(s.el) - mid); if (d < bestD) { bestD = d; best = i; } });
    if (best !== active) {
      if (active >= 0) stops[active].btn.classList.remove('on');
      active = best;
      const s = stops[active];
      s.btn.classList.add('on');
      filmLabel.querySelector('b').textContent = s.chapter.name;
      filmLabel.querySelector('span').textContent = String(s.n).padStart(2, '0');
    }
    const b = stops[active].btn, fr = film.getBoundingClientRect(), br = b.getBoundingClientRect();
    filmLabel.style.left = `${br.left - fr.left + br.width / 2}px`;
    if (track.scrollLeft > 20) hint.classList.add('off');
  };

  /* reveal: draw a chapter's dashes and arrows the first time it comes into view */
  const io = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { root: track, threshold: 0.3 });
  track.querySelectorAll('.chapter').forEach(c => io.observe(c));

  /* a vertical mouse wheel scrolls the story sideways */
  track.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    // at either end of the story, let the page scroll on (down to the wish field)
    const max = track.scrollWidth - track.clientWidth;
    if ((e.deltaY > 0 && track.scrollLeft >= max - 1) || (e.deltaY < 0 && track.scrollLeft <= 1)) return;
    e.preventDefault();
    track.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 16 : 1);
  }, { passive: false });

  /* drag to scroll (mouse) */
  let drag = null;
  track.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('a')) return;
    drag = { x: e.clientX, left: track.scrollLeft };
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 3) track.classList.add('dragging');
    track.scrollLeft = drag.left - dx;
  });
  const endDrag = () => { drag = null; track.classList.remove('dragging'); };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  /* arrow keys */
  track.addEventListener('keydown', e => {
    const step = track.clientWidth * 0.6;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); track.scrollBy({ left: step, behavior: 'smooth' }); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); track.scrollBy({ left: -step, behavior: 'smooth' }); }
  });

  track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  addEventListener('resize', update);
  update();
  setTimeout(update, 300);
})();
</script>
<script src="assets/wish.js"></script>
</body>
