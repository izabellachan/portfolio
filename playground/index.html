<!doctype html>
<html lang="en">
<head>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>izabella chan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
/* Styled with the izy design system: tokens below mirror izy's tokens.json. */
/* Layout: one full-window app. Layers stack: canvas → folder board → detail / document. Chrome floats on top. */
:root{
  /* izy colour tokens */
  --canvas:#FAFAFA; --surface:#FFFFFF; --surface-sunken:#F5F5F5; --surface-tag:#F3F3F1; --surface-inverse:#343434;
  --line-c:#E2E2E2; --line-strong:#8C8C8C;
  --text-strong:#262626; --text:#656565; --text-muted:#737373; --text-on-inverse:#FFFFFF;
  --accent-c:#6BADDB; --accent-tint-solid:#DFEBF4; --accent-text:#276A9B; --focus:#276A9B;
  /* izy spacing & radius */
  --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-full:999px;
  /* izy shadows */
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.25);
  --shadow-float:0 0.6px 0.6px -1.25px rgba(0,0,0,.18),0 2.29px 2.29px -2.5px rgba(0,0,0,.16),0 10px 10px -3.75px rgba(0,0,0,.06);
  /* izy type families */
  --font-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-text:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;

  /* the page's own names, now pointing at izy tokens */
  --bg:var(--canvas); --board:var(--canvas); --paper:var(--surface); --ink:var(--text-strong); --muted:var(--text-muted); --line:var(--line-c);
  --detail:var(--surface-sunken); --chrome:rgba(255,255,255,.82); --chrome-line:var(--line-c);
  --pill:var(--surface-inverse); --pill-ink:var(--text-on-inverse); --accent:var(--focus);
  --sticky-pink:var(--accent-tint-solid); --sticky-orange:var(--surface-tag); --sticky-ink:var(--text-strong);
  --shadow:var(--shadow-float);
  --shadow-lift:var(--shadow-sm),var(--shadow-float);
  --f-ui:var(--font-text);
  --f-mono:var(--font-text);
  --f-read:var(--font-text);
}
:root{color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-0.03em}
button{font:inherit;letter-spacing:-0.03em;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;transition:opacity .38s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1),filter .38s}
.layer.recede{opacity:0;transform:scale(.985);pointer-events:none}
.layer.zoomed{opacity:0;transform:scale(1.06);filter:blur(2px);pointer-events:none}

/* ---------- Chrome ---------- */
.chrome{position:absolute;z-index:60;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;pointer-events:none}
.chrome > *{pointer-events:auto}
.back{width:0;height:32px;border-radius:var(--radius-full);background:var(--chrome);border:.5px solid var(--chrome-line);display:grid;place-items:center;opacity:0;overflow:hidden;transition:width .35s cubic-bezier(.22,1,.36,1),opacity .25s,margin .35s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-right:-8px}
.back.on{width:32px;opacity:1;margin-right:0}
.back svg{width:14px;height:14px;flex:none}
.crumbs{height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:var(--radius-full);background:var(--chrome);border:.5px solid var(--chrome-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 12px/1.3 var(--font-text);letter-spacing:-0.03em;color:var(--muted);white-space:nowrap;max-width:calc(100vw - 120px);overflow:hidden}
.crumbs[hidden]{display:none}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs .crumb{letter-spacing:-0.03em;color:var(--muted);padding:2px 4px;margin:0 -4px;border-radius:var(--radius-full);cursor:pointer}
.crumbs .crumb:hover{color:var(--ink);background:var(--surface-sunken)}
.crumbs i{font-style:normal;opacity:.5}
.tag{position:absolute;z-index:60;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));height:24px;padding:0 12px;display:flex;align-items:center;border-radius:var(--radius-full);background:var(--chrome);border:.5px solid var(--chrome-line);font:500 11px/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--accent-text);transition:opacity .3s,transform .4s cubic-bezier(.22,1,.36,1)}
.tag.off{opacity:0;transform:translateY(-6px)}
.tag{display:none}

/* ---------- Canvas ---------- */
#canvas{z-index:1;cursor:default;touch-action:none;background:var(--bg)}
#canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.item{position:absolute;cursor:pointer;transition:opacity .3s,filter .3s}
.item > .body{width:100%;height:100%;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.item:hover > .body{transform:translateY(-2px)}
.item.dim{opacity:.28;filter:saturate(.4)}
.item.dragging{z-index:20;cursor:grabbing}
.item.dragging > .body{transform:scale(1.04);box-shadow:var(--shadow-lift)}

.sticky .body{padding:8px 10px;font:400 8.5px/1.4 var(--font-text);color:var(--sticky-ink);box-shadow:var(--shadow), inset 0 0 0 .5px var(--line);border-radius:var(--radius-xs);outline:none;overflow:hidden;letter-spacing:-0.03em}
.sticky.pink .body{background:var(--sticky-pink)}
.sticky.orange .body{background:var(--sticky-orange)}
.sticky .body[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text;box-shadow:0 0 0 2px var(--focus),var(--shadow)}

.doccard{background:var(--paper);border-radius:var(--radius-sm);box-shadow:var(--shadow), inset 0 0 0 .5px var(--line);padding:.9em .85em;display:flex;flex-direction:column;gap:.45em;overflow:hidden}
.doccard .k{font:500 .55em/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--accent-text)}
.doccard .t{font:400 .82em/1.2 var(--font-display);letter-spacing:-.02em;color:var(--text-strong)}
.doccard .ln{height:.32em;border-radius:1px;background:var(--surface-sunken)}
.item.doc{font-size:10px}

.artbox{position:relative;overflow:hidden;border-radius:var(--radius-sm);box-shadow:var(--shadow)}
.artbox::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.18));pointer-events:none}
.artbox .fn{position:absolute;left:6px;bottom:5px;z-index:1;font:500 8px/1 var(--font-text);color:rgba(255,255,255,.9);letter-spacing:-0.03em;opacity:0;transition:opacity .25s;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.artbox:hover .fn{opacity:1}
.artbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.d-img video{z-index:2}
.artbox.ph::after{display:none}
.artbox.ph{box-shadow:var(--shadow), inset 0 0 0 .5px var(--line)}
.artbox.ph .fn{opacity:1;color:var(--text-muted);text-shadow:none;font-size:11px;left:12px;bottom:10px}

/* Folder = the reference glass folder, in light grey: back panel, three papers, frosted front with a tab on the left; name underneath */
.folder{--folder-back:#E8E8EA;--folder-glass:rgba(247,247,248,.55)}
.folder .body{position:relative}
.folder .f-icon{position:absolute;left:0;top:0;width:112px;height:95px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.10)) drop-shadow(0 1px 2px rgba(0,0,0,.06))}
.folder .f-back{position:absolute;left:5px;width:102px;top:1px;height:88px;border-radius:6px;background:var(--folder-back)}
.folder .f-paper{position:absolute;border-radius:4px;transition:transform .45s cubic-bezier(.34,1.4,.64,1),translate .45s cubic-bezier(.34,1.4,.64,1)}
.folder .f-sheet{background:#fff linear-gradient(#DADADA,#DADADA) 7px 9px/62% 4px no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.folder .f-sheet::after{content:"";position:absolute;left:7px;right:9px;top:20px;height:26px;background:repeating-linear-gradient(#E4E4E4 0 2px,transparent 2px 6px)}
.folder .s1{left:10px;top:7px;width:42px;height:68px;transform:rotate(-6deg)}
.folder .s2{left:33px;top:0;width:50px;height:74px;transform:rotate(-1deg)}
.folder .s3{left:64px;top:9px;width:38px;height:66px;transform:rotate(4deg)}
.folder .f-photo{box-shadow:0 1px 2px rgba(0,0,0,.12)}
.folder .f-front{position:absolute;left:0;top:18px;width:112px;height:77px;background:linear-gradient(90deg,rgba(0,0,0,.04),transparent 16%,transparent 84%,rgba(0,0,0,.04)),linear-gradient(180deg,rgba(255,255,255,.28),transparent 35%,rgba(0,0,0,.05)),var(--folder-glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);clip-path:path('M5 0H55C59 0 61 2 63 6L66 10C68 13 70 14 74 14H106Q112 14 112 20L109 71Q108.6 77 103 77H9Q3.6 77 3.3 71L0 6Q0 0 5 0Z')}
.folder .f-edge{position:absolute;left:0;top:18px;width:112px;height:77px;pointer-events:none;overflow:visible}
.folder .f-name{position:absolute;left:-8px;right:-8px;top:103px;text-align:center;font:500 8px/1.25 var(--font-text);letter-spacing:-0.03em;color:var(--text-strong)}
.folder .f-sub{display:block;font-weight:400;font-size:6.5px;color:var(--text-muted)}
.folder:hover .f-paper,.folder.open .f-paper{translate:0 -5px}
.folder:hover .s2,.folder.open .s2{translate:0 -8px}
/* front flap tips forward from its bottom edge */
.folder .f-front,.folder .f-edge{transform-origin:50% 100%;transform:perspective(220px) rotateX(0deg);transition:transform .45s cubic-bezier(.34,1.3,.64,1)}
.folder:hover .f-front,.folder:hover .f-edge,.folder.open .f-front,.folder.open .f-edge{transform:perspective(220px) rotateX(-16deg)}

#fan{position:absolute;left:0;top:0;pointer-events:none}
.fan-item{position:absolute;pointer-events:auto;cursor:pointer}
.fan-item.doc{font-size:7.5px}
.notecard{background:var(--paper);border-radius:var(--radius-sm);box-shadow:var(--shadow), inset 0 0 0 .5px var(--line);padding:.7em .75em;font:400 .72em/1.4 var(--font-text);color:var(--text);display:flex;gap:.5em;overflow:hidden;letter-spacing:-0.03em}
.notecard::before{content:"";flex:none;width:.5em;height:.5em;border-radius:50%;background:var(--accent-c);margin-top:.3em}
.fan-item.note{font-size:9px}

.ctl{position:absolute;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;transition:opacity .3s,transform .4s cubic-bezier(.22,1,.36,1)}
.ctl.off{opacity:0;transform:translateY(10px);pointer-events:none}
.ctl .grp{display:flex;align-items:center;height:32px;border-radius:var(--radius-full);background:var(--chrome);border:.5px solid var(--chrome-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:0 4px}
.ctl button{height:24px;min-width:24px;border-radius:var(--radius-full);display:grid;place-items:center;font-size:12px;color:var(--ink)}
.ctl button:hover{background:var(--surface-sunken)}
.ctl .pct{font:500 11px/1 var(--font-text);font-variant-numeric:tabular-nums;min-width:40px;text-align:center;color:var(--muted);letter-spacing:-0.03em}
.ctl svg{width:13px;height:13px}
.hint{position:absolute;z-index:5;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font:500 11px/1.4 var(--font-text);color:var(--text-muted);letter-spacing:-0.03em;text-transform:uppercase;transition:opacity .3s;max-width:calc(100% - 200px)}
.hint.off{opacity:0}
#bfName{font-family:var(--font-text);color:var(--accent-text);visibility:hidden;letter-spacing:-0.03em}

/* ---------- Board ---------- */
#board{z-index:2;background:transparent}
#board.solid{background:var(--board)}
.board-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.board-grid{max-width:1060px;margin:0 auto;columns:150px;column-gap:16px}
.tile{break-inside:avoid;margin-bottom:16px;cursor:pointer;transform-origin:0 0}
.board-grid.pinned{columns:auto;display:flex;gap:16px;align-items:flex-start}
.bcol{flex:1 1 0;min-width:0}
.tile.img .artbox{width:100%;border-radius:var(--radius-md);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.tile.img:hover .artbox{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.tile.doc .doccard{font-size:14px;aspect-ratio:3/4;border-radius:var(--radius-md);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.tile.doc:hover .doccard{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.tile.note{font-size:15px;cursor:default}
.board-foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font:500 11px/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--muted);pointer-events:none}

/* ---------- Detail ---------- */
#detail,#doc{z-index:3}
#detail .bg{position:absolute;inset:0;background:var(--detail)}
.d-wrap{position:absolute;inset:0;overflow:auto;display:flex;justify-content:center;padding:80px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.d-grid{display:grid;grid-template-columns:28px auto 200px;column-gap:32px;row-gap:24px;align-items:start;margin:auto 0}
.d-sw{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:12px;padding-top:2px}
.sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .25s cubic-bezier(.34,1.5,.64,1)}
.sw:hover{transform:scale(1.18)}
.d-img{grid-column:2;grid-row:1;border-radius:var(--radius-md);transition:transform .45s cubic-bezier(.22,1,.36,1);cursor:zoom-in}
.d-img.zoom{transform:scale(1.35);cursor:zoom-out;z-index:2}
.d-meta{grid-column:3;grid-row:1;display:flex;flex-direction:column;gap:12px;padding-top:2px}
.d-meta .l{font:500 11px/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.d-meta .v{font:400 12px/1.2 var(--font-text);font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:-0.03em}
.d-text{grid-column:2;grid-row:2;font:400 16px/1.5 var(--font-display);color:var(--text);text-wrap:pretty}
.d-bar{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:var(--radius-lg);background:var(--pill);color:var(--pill-ink);box-shadow:var(--shadow-sm),var(--shadow-float)}
.d-bar button{width:36px;height:32px;border-radius:var(--radius-full);display:grid;place-items:center}
.d-bar button:hover{background:rgba(255,255,255,.12)}
.d-bar button.on{background:rgba(255,255,255,.18)}
.d-bar svg{width:15px;height:15px}

/* ---------- Document ---------- */
#doc .sheet-bg{position:absolute;inset:0;background:var(--paper)}
.doc-scroll{position:absolute;inset:0;overflow-y:auto;padding:80px max(24px,env(safe-area-inset-right,0px)) 80px max(24px,env(safe-area-inset-left,0px));user-select:text;-webkit-user-select:text}
.doc-inner{max-width:560px;margin:0 auto}
.doc-inner.wide{max-width:960px}
.doc-slide{display:block;width:100%;height:auto;margin:0 0 16px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 .5px var(--line)}
.doc-inner h1{font:400 clamp(26px,3.5vw,32px)/1.2 var(--font-display);letter-spacing:-.04em;color:var(--text-strong);margin:0 0 12px;text-wrap:balance}
.doc-inner .intro{font:400 16px/1.5 var(--font-display);color:var(--text);max-width:62ch;margin:0 0 32px}
.doc-inner h3{font:400 20px/1.3 var(--font-display);letter-spacing:-.02em;color:var(--text-strong);margin:32px 0 12px}
.doc-inner p{font:400 14px/1.5 var(--font-text);color:var(--text);margin:0 0 12px;max-width:62ch;letter-spacing:-0.03em}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;align-items:center;gap:12px;font:400 14px/1.5 var(--font-text);color:var(--text);cursor:default;padding:2px 0;letter-spacing:-0.03em}
.cb{flex:none;width:16px;height:16px;border-radius:var(--radius-xs);border:.75px solid var(--line-strong);display:grid;place-items:center;transition:background .2s,border-color .2s}
.cb svg{width:10px;height:10px;stroke:var(--paper);stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .28s .05s cubic-bezier(.22,1,.36,1)}
.checks li.done .cb{background:var(--accent-text);border-color:var(--accent-text)}
.checks li.done .cb svg{stroke-dashoffset:0}
.checks .tx{background:linear-gradient(currentColor,currentColor) 0 55%/0 1px no-repeat;transition:background-size .3s cubic-bezier(.22,1,.36,1),color .3s}
.checks li.done .tx{background-size:100% 1px;color:var(--muted)}
.amt{display:flex;justify-content:space-between;gap:16px;font:400 14px/1.5 var(--font-text);color:var(--text);padding:4px 0;border-bottom:.5px solid var(--line);letter-spacing:-0.03em}
.amt span:last-child{font:500 14px/1.5 var(--font-text);font-variant-numeric:tabular-nums;color:var(--text-strong);letter-spacing:-0.03em}
.doc-meta{font:500 11px/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--accent-text);margin-bottom:16px}

.fly{position:fixed;z-index:50;pointer-events:none;border-radius:var(--radius-sm);overflow:hidden}
.toast{position:absolute;z-index:70;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--pill);color:var(--pill-ink);font:500 12px/1.3 var(--font-text);letter-spacing:-0.03em;padding:8px 12px;border-radius:var(--radius-full);opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ---------- Update log: dot log ---------- */
.dl-page{max-width:640px;margin:0 auto;text-align:left}
.dl{background:var(--surface);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 .5px var(--line);padding:24px 28px;margin-top:16px;max-width:640px;display:grid;grid-template-columns:auto minmax(220px,1fr);gap:32px;align-items:stretch}
.dl-eyebrow{font:500 12px/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--text-strong)}
.dl-big{display:flex;align-items:baseline;gap:8px;margin:6px 0 20px}
.dl-big b{font:500 60px/0.95 var(--font-display);letter-spacing:-.05em;color:var(--text-strong)}
.dl-big span{font:400 16px/1 var(--font-display);letter-spacing:-.03em;color:var(--text)}
.dl-grid{display:flex;flex-direction:column;gap:16px}
.dl-month{display:grid;grid-template-columns:40px 1fr;align-items:start}
.dl-label{font:500 13px/13px var(--font-display);letter-spacing:-.01em;text-transform:uppercase;color:var(--text-muted)}
.dl-month.cur .dl-label{color:var(--text-strong)}
.dl-dots{display:grid;grid-template-columns:repeat(14,13px);gap:6px 6px}
.dl-dot{width:9px;height:9px;margin:2px;border-radius:50%;background:#D9D9D9;display:block;padding:0;border:0}
.dl-dot.future{background:transparent;box-shadow:inset 0 0 0 1px #C8C8C8}
.dl-dot.on-day{background:var(--accent-c);cursor:pointer;transition:transform .15s,box-shadow .15s}
.dl-dot.on-day:hover{transform:scale(1.25)}
.dl-dot.on-day.on{background:var(--accent-text);box-shadow:0 0 0 2px var(--accent-tint-solid)}
.dl-dot:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.dl-detail{padding-left:32px;border-left:.5px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.dl-d-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dl-d-date{font:500 11px/1.2 var(--font-text);letter-spacing:-0.03em;text-transform:uppercase;color:var(--text-muted)}
.dl-d-tag{font:500 11px/1 var(--font-text);color:var(--accent-text);background:var(--accent-tint-solid);border-radius:var(--radius-xs);padding:4px 6px;letter-spacing:-0.03em}
.dl-d-title{font:400 20px/1.3 var(--font-display);letter-spacing:-.03em;color:var(--text-strong)}
.dl-d-list{margin:8px 0 0 !important;padding:0 0 0 18px !important;display:flex;flex-direction:column;gap:8px}
.dl-d-list li{font:400 16px/1.4 var(--font-display);letter-spacing:-.02em;color:var(--text-strong);padding-left:2px}

function fanLayout(f){

    const pw = 112, ph = im => Math.min(154, Math.round(pw * im.h / im.w));

    out.push({kind:'img', data:f.images[0], x:R - 2 * pw - 8, y:y + 4, w:pw, h:h0, r:-2});
    out.push({kind:'img', data:f.images[1], x:R - pw, y:y + 4, w:pw, h:h1, r:2});
    y += Math.max(h0, h1) + 16;
  }

  if (!f.docs.length && !f.notes.length){
    const extra = f.images.slice(2).filter(im => !im.video && !im.ph).slice(0, 4);
    const pw = 72, ph = im => Math.min(96, Math.round(pw * im.h / im.w));

let busy = false;

  const parts = [];
  stack.forEach((s, d) => { if (s.type === 'board') parts.push({label:s.folder.name, depth:d}); if (s.type === 'detail') parts.push({label:s.img.name, depth:d}); if (s.type === 'doc') parts.push({label:s.doc.title, depth:d}); });
  if (parts.length) parts.unshift({label:'playground', depth:0});

  parts.forEach((p, i) => {
    if (i) cr.append(el('i', '', '/'));
    const last = i === parts.length - 1;
    const n = last ? el('b') : el('button', 'crumb');

/* ---------------- Board (inside a folder) ---------------- */
const board = $('board'), grid = $('boardGrid');

  let h = Math.min(Hh * (narrow ? .44 : .56), 480), w = h * curImg.w / curImg.h;
  const maxW = narrow ? W - 40 : Math.min(W - 420, 440);
  if (w > maxW){ w = maxW; h = w * curImg.h / curImg.w; }
  dImg.style.width = w + 'px'; dImg.style.height = h + 'px';
  $('dText').style.width = (narrow ? Math.min(W - 40, 440) : Math.max(w, 260)) + 'px';
}
addEventListener('resize', layoutDetail);
function flyBox(img, rect){

}
const rel = (r, o) => ({left: r.left - o.left, top: r.top - o.top, width: r.width, height: r.height});
const rectKf = r => ({left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px'});
/* decks: page through slides in the open view */
let slideIdx = 0;
function showSlide(i){
  const sl = curImg && curImg.slides; if (!sl) return;
  slideIdx = (i + sl.length) % sl.length;
  dImg.style.background = `url("${sl[slideIdx]}") center / cover no-repeat`;
  const fn = dImg.querySelector('.fn'); if (fn) fn.textContent = `${curImg.name} · ${slideIdx + 1}/${sl.length}`;
  const v = [...$('dMeta').querySelectorAll('.l')].find(l => l.textContent === 'Slide');
  if (v) v.nextElementSibling.textContent = `${slideIdx + 1} of ${sl.length}`;
}
function openDetail(img, srcEl, layer){
  if (busy) return; busy = true;
  curImg = img; dImg.classList.remove('zoom'); $('bZoom').classList.remove('on');
  dImg.style.background = bgOf(img); dImg.innerHTML = `<span class="fn">${img.name}</span>`;
  if (img.video){ const v = videoEl(img); v.controls = true; v.muted = false; v.removeAttribute('muted'); dImg.prepend(v); }

  const meta = img.slides ? [['Name', img.name], ['Slide', `1 of ${img.slides.length}`], ['Size', img.res], ['Source', img.source]] : img.src ? [['Name', img.name], ['Resolution', img.res], ['Source', img.source]] : [['File', img.name], ['Resolution', img.res], ['Size', img.size], ['Date added', img.date], ['Colour profile', img.profile]];
  $('dMeta').innerHTML = meta.map(([l, v]) => `<div><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  $('dText').textContent = img.caption || '';
  slideIdx = 0; $('bPrev').hidden = $('bNext').hidden = !img.slides; if (img.slides){ img.slides.forEach(u => { const p = new Image(); p.src = u; }); showSlide(0); }
  $('dMeta').style.visibility = $('bInfo').classList.contains('on') ? '' : 'hidden';
  detail.hidden = false; detail.classList.remove('recede'); layoutDetail();
  const S = srcEl.getBoundingClientRect(), D = dImg.getBoundingClientRect();
  const fly = flyBox(img, D);

  layer.classList.add('recede');
  anim($('dBg'), [{opacity:0}, {opacity:1}], {d:360});
  const fa = anim(fly, [rectKf(S), rectKf(D)], {d:560, e:'cubic-bezier(.2,.9,.22,1)'});
  [...$('dSw').children].forEach((s, i) => anim(s, [{opacity:0, transform:'scale(.2)'}, {opacity:1, transform:'scale(1)'}], {d:460, e:SPRING, delay:220 + i * 50}));
  [...$('dMeta').children].forEach((m, i) => anim(m, [{opacity:0, transform:'translateX(14px)'}, {opacity:1, transform:'none'}], {d:460, delay:240 + i * 45}));
  anim($('dText'), [{opacity:0, transform:'translateY(14px)'}, {opacity:1, transform:'none'}], {d:500, delay:320});
  anim($('dBar'), [{opacity:0, transform:'translate(-50%,90px)'}, {opacity:1, transform:'translate(-50%,0)'}], {d:620, e:SPRING, delay:260});

function closeDetail(){
  busy = true;
  const top = stack[stack.length - 1];

  dImg.classList.remove('zoom');
  const D = dImg.getBoundingClientRect();
  const fly = flyBox(top.img, D); dImg.style.visibility = 'hidden';
  top.layer.classList.remove('recede');
  const out = [];
  [...$('dSw').children, ...$('dMeta').children, $('dText')].forEach(n => out.push(anim(n, [{opacity:1}, {opacity:0}], {d:150})));
  out.push(anim($('dBar'), [{opacity:1, transform:'translate(-50%,0)'}, {opacity:0, transform:'translate(-50%,90px)'}], {d:280, e:'cubic-bezier(.5,0,.75,0)'}));
  out.push(anim($('dBg'), [{opacity:1}, {opacity:0}], {d:380, delay:60}));
  const S = top.srcEl.getBoundingClientRect();
  const fa = anim(fly, [rectKf(D), rectKf(S)], {d:520, e:'cubic-bezier(.2,.9,.22,1)'});

dImg.onclick = () => { dImg.classList.toggle('zoom'); $('bZoom').classList.toggle('on', dImg.classList.contains('zoom')); };
$('bZoom').onclick = () => dImg.click();
$('bPrev').onclick = () => showSlide(slideIdx - 1);
$('bNext').onclick = () => showSlide(slideIdx + 1);
addEventListener('keydown', ev => { if (!curImg || !curImg.slides || stack[stack.length - 1].type !== 'detail') return; if (ev.key === 'ArrowRight') showSlide(slideIdx + 1); if (ev.key === 'ArrowLeft') showSlide(slideIdx - 1); });
$('bInfo').onclick = () => {
  const on = !$('bInfo').classList.toggle('on'); const m = $('dMeta');
  if (on){ anim(m, [{opacity:1, transform:'none'}, {opacity:0, transform:'translateX(14px)'}], {d:240}).finished.then(a => { m.style.visibility = 'hidden'; a.cancel(); }); }
  else { m.style.visibility = ''; anim(m, [{opacity:0, transform:'translateX(14px)'}, {opacity:1, transform:'none'}], {d:320}).finished.then(a => a.cancel()); }
};
detail.addEventListener('click', ev => { if (ev.target.closest('.d-wrap') && !ev.target.closest('.d-grid > *')) goBack(); });

let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1500); }
function copy(text, msg){
  const done = () => toast(msg);
  try { navigator.clipboard.writeText(text).then(done, () => toast(text)); } catch { toast(text); }
}

/* ---------------- Document view ---------------- */
const docL = $('doc'), docInner = $('docInner');
/* Update log: one dot per day, tap a dot to see that day's update */
function renderUpdates(d){
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date(d.today + 'T12:00');
  const curKey = d.today.slice(0, 7);
  const active = Object.keys(d.entries).filter(k => k.startsWith(curKey)).length;
  const wrap = el('div', 'dl');
  const cal = el('div', 'dl-cal');
  cal.append(el('div', 'dl-eyebrow', 'Active days in ' + MONTHS[today.getMonth()]));
  const big = el('div', 'dl-big'); big.innerHTML = `<b>${active}</b><span>days</span>`; cal.append(big);
  const grid = el('div', 'dl-grid');
  const detail = el('div', 'dl-detail');
  let picked = null;
  const show = (key, btn) => {
    if (picked) picked.classList.remove('on');
    picked = btn; btn.classList.add('on');
    const [area, title, note] = d.entries[key];
    const dt = new Date(key + 'T12:00');
    detail.innerHTML = '';
    const date = el('div', 'dl-d-date'); date.textContent = dt.toLocaleDateString('en-US', {month:'long', day:'numeric'});
    const ul = el('ul', 'dl-d-list');
    [title, note].filter(Boolean).forEach(t => { const li = el('li'); li.textContent = t; ul.append(li); });
    detail.append(date, ul);
  };
  let last = null;
  d.months.forEach(m => {
    const [y, mo] = m.split('-').map(Number);
    const days = new Date(y, mo, 0).getDate();
    const row = el('div', 'dl-month' + (m === curKey ? ' cur' : ''));
    row.append(el('div', 'dl-label', MONTHS[mo - 1].slice(0, 3)));
    const dots = el('div', 'dl-dots');
    for (let i = 1; i <= days; i++){
      const key = `${m}-${String(i).padStart(2, '0')}`;
      const future = new Date(key + 'T12:00') > today;
      const has = d.entries[key];
      const dot = el(has ? 'button' : 'span', 'dl-dot' + (has ? ' on-day' : future ? ' future' : ''));
      const label = `${MONTHS[mo - 1].slice(0, 3)} ${i}`;
      if (has){
        dot.type = 'button'; dot.title = label + ': ' + has[1];
        dot.setAttribute('aria-label', label + ', ' + has[1]);
        dot.addEventListener('click', e => { e.stopPropagation(); show(key, dot); });
        last = [key, dot];
      } else dot.title = label;
      dots.append(dot);
    }
    row.append(dots); grid.append(row);
  });
  cal.append(grid);
  wrap.append(cal, detail);
  if (last) show(...last);
  const sub = el('p', 'intro'); sub.textContent = 'Keeping track of everything I’ve done so far.';
  const parts = [el('div', 'doc-meta', 'Log'), el('h1', '', d.title), sub, wrap];
  if (d.sample){ const f = el('p', 'log-sample'); f.textContent = 'Sample updates for the prototype. Real updates replace these.'; parts.push(f); }
  const page = el('div', 'dl-page'); page.append(...parts);
  docInner.append(page);
  return [page];
}
function renderDoc(d){
  if (d.entries){ docInner.innerHTML = ''; docInner.classList.add('wide'); return renderUpdates(d); }
  docInner.innerHTML = ''; docInner.classList.toggle('wide', !!d.wide);
  const parts = [el('div', 'doc-meta', d.kind), el('h1', '', d.title)];
  if (d.intro) parts.push(el('p', 'intro', d.intro));
  d.sections.forEach(s => {
    const sec = el('div', 'sec'); if (s.h) sec.append(el('h3', '', s.h));
    if (s.p) s.p.forEach(t => sec.append(el('p', '', t)));
    if (s.slides) s.slides.forEach((src, k) => { const im = el('img', 'doc-slide'); im.src = src; im.alt = `${d.title}, slide ${k + 1}`; im.loading = 'lazy'; sec.append(im); });
    if (s.amounts) s.amounts.forEach(([a, b]) => { const r = el('div', 'amt'); r.append(el('span', '', a), el('span', '', b)); sec.append(r); });
    if (s.checks){
      const ul = el('ul', 'checks');
      s.checks.forEach((c, i) => {
        const li = el('li', s.state[i] ? 'done' : ''); li.setAttribute('role', 'checkbox'); li.setAttribute('aria-checked', s.state[i]); li.setAttribute('aria-readonly', 'true');
        li.innerHTML = `<span class="cb"><svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.6l4.6-5"/></svg></span><span class="tx"></span>`;
        li.querySelector('.tx').textContent = c;
        ul.append(li);
      });
      sec.append(ul);
    }
    parts.push(sec);

}
function openDoc(d, srcEl, layer){
  if (busy) return; busy = true;

  const S = srcEl.getBoundingClientRect(), A = docL.getBoundingClientRect();
  const sheet = el('div', 'fly'); sheet.style.background = 'var(--paper)'; sheet.style.boxShadow = 'var(--shadow-lift)'; sheet.style.position = 'absolute';
  docL.insertBefore(sheet, $('docScroll'));
  srcEl.style.visibility = 'hidden';
  $('docBg').style.opacity = '0';
  layer.classList.add('recede');
  const sa = anim(sheet, [{...rectKf(rel(S, A)), borderRadius:'3px'}, {...rectKf(rel(A, A)), borderRadius:'0px'}], {d:560, e:'cubic-bezier(.2,.9,.22,1)'});
  const flat = parts.flatMap(p => p.classList.contains('sec') ? [...p.children].flatMap(c => c.tagName === 'UL' ? [...c.children] : [c]) : [p]);
  flat.forEach((n, i) => anim(n, [{opacity:0, transform:'translateY(14px)'}, {opacity:1, transform:'none'}], {d:480, delay:260 + Math.min(i, 18) * 26}));
  stack.push({type:'doc', doc:d, srcEl, layer}); syncChrome();
  sa.finished.then(() => { $('docBg').style.opacity = ''; sheet.remove(); busy = false; });
}
function closeDoc(){
  busy = true;
  const top = stack[stack.length - 1];
  const A = docL.getBoundingClientRect();
  const sheet = el('div', 'fly'); sheet.style.background = 'var(--paper)'; sheet.style.boxShadow = 'var(--shadow-lift)';
  sheet.style.position = 'absolute'; Object.assign(sheet.style, rectKf(rel(A, A))); docL.insertBefore(sheet, $('docScroll'));
  $('docBg').style.opacity = '0';
  const ca = anim($('docScroll'), [{opacity:1}, {opacity:0}], {d:160});

  const S = top.srcEl.getBoundingClientRect();
  const sa = anim(sheet, [{...rectKf(rel(A, A)), borderRadius:'0px', opacity:1}, {...rectKf(rel(S, A)), borderRadius:'3px', opacity:1}], {d:500, e:'cubic-bezier(.2,.9,.22,1)', delay:60});
  stack.pop(); syncChrome();
  Promise.all([sa.finished, ca.finished]).then(() => {
    top.srcEl.style.visibility = ''; sheet.remove(); docL.hidden = true; $('docBg').style.opacity = '';

/* the page can load before its frame has a size; refit once it does, until the viewer moves the canvas */
let touched = false; canvas.addEventListener('pointerdown', () => touched = true); canvas.addEventListener('wheel', () => touched = true, {passive:true});

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (stack.length === 1) fit(true); }, 150); });
})();
